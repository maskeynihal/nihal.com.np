<!doctype html>
<html lang="en" data-lamp="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side art v2 · eight ideas</title>
<style>
:root{
  --blue:#1f3fe0;--blue-deep:#142fb8;--blue-ink:#0a1c6b;--paper:#f6f5f1;
  --page:#1f3fe0;--page-deep:#142fb8;--ink:#fff;--ink-soft:rgb(255 255 255/.85);
  --stroke:rgb(255 255 255/.85);--hair:rgb(255 255 255/.12);--hair-strong:rgb(255 255 255/.3);
  --panel:#f6f5f1;--panel-ink:#0a1c6b;--panel-ink-soft:rgb(10 28 107/.65);--panel-hair:rgb(10 28 107/.14);
  --inset:12px;--gutter:24px;--index-w:7.5rem;
}
:root[data-lamp='4']{--page:#f6f5f1;--page-deep:#ecebe5;--ink:#0a1c6b;--ink-soft:rgb(10 28 107/.7);--stroke:#1f3fe0;--hair:rgb(31 63 224/.1);--hair-strong:rgb(31 63 224/.3);--panel:#fff}
:root[data-lamp='3']{--page:#d9dae3;--page-deep:#cfd0db;--ink:#0a1c6b;--ink-soft:rgb(10 28 107/.76);--stroke:#1a3acb;--hair:rgb(10 28 107/.13);--hair-strong:rgb(10 28 107/.34);--panel:#ebebf0}
:root[data-lamp='2']{--page:#b3b4c6;--page-deep:#a6a7bb;--ink:#0a1c6b;--ink-soft:rgb(10 28 107/.82);--stroke:#142fb8;--hair:rgb(10 28 107/.16);--hair-strong:rgb(10 28 107/.38);--panel:#d6d6e0;--panel-ink-soft:rgb(10 28 107/.74);--panel-hair:rgb(10 28 107/.2)}
:root[data-lamp='0']{--page:#0a1348;--page-deep:#060d33;--ink:#e8ecff;--ink-soft:rgb(232 236 255/.82);--stroke:rgb(232 236 255/.8);--hair:rgb(232 236 255/.1);--hair-strong:rgb(232 236 255/.26);--panel:#c3c7dc;--panel-ink-soft:rgb(10 28 107/.74);--panel-hair:rgb(10 28 107/.2)}
*{box-sizing:border-box}
html{background:var(--page);color:var(--ink)}
body{margin:0;font:17px/1.6 Georgia,'Times New Roman',serif;color:var(--ink);background:var(--page);overflow-x:hidden}
#art{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:0}
.sheet-border{position:fixed;inset:0;z-index:30;pointer-events:none;border:var(--inset) solid var(--page-deep)}
.sheet-border::after{content:'';position:absolute;inset:-1px;border:1px solid var(--stroke)}
.index{position:fixed;z-index:5;left:calc(var(--inset) + var(--gutter));top:calc(var(--inset) + 28px);width:var(--index-w);font:11px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.index div{padding:6px 0;border-top:1px solid var(--hair-strong)}
.index b{display:block;font-weight:400;opacity:.6}
.sheet{position:relative;z-index:1;padding:calc(var(--inset) + var(--gutter)) calc(var(--inset) + var(--gutter)) 110px calc(var(--inset) + var(--index-w) + var(--gutter)*2)}
.titleblock{max-width:80rem;margin:0 auto;padding:28px 0 8px}
.titleblock h1{font-weight:500;font-size:46px;line-height:1.05;margin:0 0 6px;letter-spacing:-.015em}
.titleblock .kick{font:12px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 16px}
.titleblock p{max-width:44rem}
.section{padding-block:48px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gutter);max-width:80rem;margin-inline:auto}
.txt{min-width:0;grid-row:1}
.txt.l{grid-column:1/7}.txt.r{grid-column:7/13}
.empty-col{min-width:0}
.empty-col.l{grid-column:1/7;grid-row:1}.empty-col.r{grid-column:7/13;grid-row:1}
.eyebrow{font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 14px}
h2{font-weight:500;font-size:38px;line-height:1.1;margin:0 0 24px;letter-spacing:-.01em}
p{margin:0 0 20px;color:var(--ink-soft);max-width:34rem}
a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.panel{background:var(--panel);color:var(--panel-ink);border:1px solid var(--panel-hair);border-radius:6px;padding:18px 22px;margin:8px 0 22px;max-width:34rem}
.panel .eyebrow{color:var(--panel-ink-soft);margin-bottom:8px}
.panel h3{font-weight:500;font-size:21px;margin:0 0 2px;line-height:1.25}
.panel p{color:var(--panel-ink-soft);margin:6px 0 0;font-size:15px;line-height:1.5}
.panel .meta{font:11px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.04em;color:var(--panel-ink-soft)}
.panel .links{font:12px/1.6 ui-monospace,Menlo,monospace;margin-top:8px}
.panel .links a{margin-right:12px;color:var(--panel-ink)}
.panel dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:15px}
.panel dt{font:12px/1.9 ui-monospace,Menlo,monospace;color:var(--panel-ink-soft);text-transform:uppercase;letter-spacing:.06em}
.panel dd{margin:0;border-bottom:1px solid var(--panel-hair)}
.rows{max-width:34rem;margin:0 0 22px;padding:0;list-style:none}
.rows li{padding:10px 0;border-top:1px solid var(--hair-strong);font-size:15px;line-height:1.45;color:var(--ink-soft)}
.rows b{display:block;font-weight:500;font-size:16px;color:var(--ink)}
.rows span.m{font:11px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.05em;opacity:.8}
.rows ul{margin:6px 0 0;padding-left:18px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:14px}
.field{display:block;margin:0 0 12px;max-width:34rem}
.field span{display:block;font:11px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.field input,.field textarea{width:100%;font:inherit;font-size:16px;color:var(--panel-ink);background:var(--panel);border:1px solid var(--panel-hair);border-radius:4px;padding:10px 12px}
.btn{font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--page);background:var(--ink);border:0;border-radius:4px;padding:14px 22px;cursor:pointer}
.foot{max-width:80rem;margin:0 auto;font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--ink-soft);padding:8px 0 24px}
/* picker */
.pick{position:fixed;z-index:40;right:28px;bottom:28px;font:12px/1 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--page-deep);border:1px solid var(--hair-strong);border-radius:10px;padding:6px;width:min(380px,calc(100vw - 56px));box-shadow:0 6px 24px rgb(0 0 0/.22)}
.pick *{-webkit-tap-highlight-color:transparent}
.pick button{font:inherit;color:inherit;background:transparent;border:1px solid var(--hair-strong);border-radius:6px;min-height:44px;min-width:44px;cursor:pointer;padding:0 6px;touch-action:manipulation}
.pick button[aria-pressed=true]{background:var(--ink);color:var(--page);border-color:var(--ink)}
.pick button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pick .bar{display:flex;gap:6px;align-items:stretch}
.pick .bar .cur{flex:1;text-align:left;padding:0 10px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.pick .bar .cur b{font-size:17px;font-weight:600}
.pick .bar .cur i{font-style:normal;opacity:.7}
.pick .bar .lampbtn{min-width:66px}
@media (max-width:480px){.pick .bar .cur i{display:none}.pick .bar .cur{padding:0 8px;gap:6px}.pick .bar .cur b{font-size:18px}}
.pick .more{display:none;margin-top:6px}
.pick.open .more{display:block}
.pick .grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick .grid8 button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;padding:4px 2px}
.pick .grid8 b{font-size:16px;font-weight:600;line-height:1}
.pick .grid8 small{font-size:10px;letter-spacing:.02em;opacity:.85;line-height:1.1;white-space:nowrap}
.pick .lamps{display:grid;grid-template-columns:auto repeat(5,1fr);gap:6px;margin-top:6px;align-items:center}
.pick .lamps label{opacity:.7;text-transform:uppercase;letter-spacing:.08em;font-size:10px;padding:0 4px}
.pick .hint{margin-top:6px;opacity:.7;font-size:10px;line-height:1.35;letter-spacing:.02em}
@media (max-width:1023px){
  .index{display:none}
  .sheet{padding:calc(var(--inset) + 16px) calc(var(--inset) + 16px) 110px}
  .titleblock h1{font-size:36px}
  .txt.l,.txt.r{grid-column:1/-1;grid-row:2}
  .empty-col.l,.empty-col.r{display:block;grid-column:1/-1;grid-row:1;height:clamp(380px,52vh,470px);margin-bottom:22px}
  .section{padding-block:30px}
  .pick{right:50%;transform:translateX(50%);bottom:20px;width:min(380px,calc(100vw - 48px))}
}
</style>
</head>

<script>
(() => {
'use strict';
/* ================= real copy (src/content/copy.ts, cv.ts, work.ts, oss.ts, writing.ts) ================= */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const NAV=['desk','about','projects','open source','writing','cv','contact'];
const TB={name:'nihal maskey',kicker:'lead software engineer · kathmandu, nepal',line:'Lead engineer at Leapfrog Technology, where my team builds a US behavioural-health platform on AWS. Co-founder of Daboo Spaces, a coworking space in Sankhamul, Kathmandu. This site collects my projects, open-source contributions and writing.'};
const ABOUT=["I'm a software engineer in Kathmandu, Nepal. I've been building for the web since 2019, the last six at Leapfrog Technology, where I went from intern to lead engineer.",'Today I lead the team behind a US behavioural-health platform. The work is mostly TypeScript, React, Node.js and AWS: queues, Lambdas and Step Functions, with patient data that has to meet HIPAA and SOC 2. I care about fast pages, boring deploys and code the next person can read.','I work with people in the US, Australia and Nepal, so a lot of my job is writing things down clearly and running reviews that teach something.'];
const FACTS=[['location','Kathmandu, Nepal'],['role','Lead Engineer, Leapfrog Technology'],['co-founder','Daboo Spaces'],['stack','TypeScript, React, Node.js, Laravel, AWS'],['open to','mentorship, consulting, talks']];
const WORK=[
 ['trayt health','jan 2025 → · lead engineer','Leapfrog Technology, for Trayt Health','A behavioral-health platform for psychiatry access programs and managed care organizations. I joined the project as a senior engineer in 2023 and have led the engineering team since January 2025. My own code is mostly on AWS: SQS, EventBridge, Lambda and Step Functions for backups, metrics and notifications, plus the HIPAA and SOC 2 work that comes with health data.',[]],
 ['tz converter','nov 2026 · 0.8.1 in the chrome web store and firefox add-ons','Chrome, Edge, Brave, Firefox',"A browser extension, TypeScript, Manifest V3. Select a time on a page and a popover shows it in the zones you've chosen. It also has a full converter, an epoch converter, right-click convert, custom date formats, and a world clock at tz.nihal.com.np/clock. I built it because the people I work with are in Nepal, Australia and the US.",[['Chrome Web Store','https://chromewebstore.google.com/detail/tz-converter-%E2%80%94-timezone-t/cokhjgalkhboifkgoomlbaigocjpmhkk'],['Firefox Add-ons','https://addons.mozilla.org/en-US/firefox/addon/tz-converter-timezone-tools/'],['tz.nihal.com.np','https://tz.nihal.com.np/'],['GitHub','https://github.com/maskeynihal/tz-extension']]],
 ['space hog','oct 2026 · rust, egui','macOS, Linux','A desktop app that shows what is using your disk: largest files, drill-down by folder, breakdown by file type, cache cleanup suggestions, and a CLI mode. Universal build for macOS, and Linux.',[['GitHub','https://github.com/maskeynihal/space-hog']]],
 ['car sensors','oct 2026 · arduino uno r4 wifi','Arduino UNO R4 WiFi','Firmware for car sensors. A UNO R4 reads water temperature from a DS18B20 and air temperature and humidity from a DHT22, shows them on a small OLED, and sounds a buzzer on alarm. The repo is set up so a coding agent can build and run the firmware in a Wokwi emulator on a Mac before anything is flashed to the car.',[['GitHub','https://github.com/maskeynihal/sensor-for-cars'],['the write-up on Hashnode','https://nihalmaskey.hashnode.dev/i-built-a-water-air-monitor-on-an-arduino-and-the-buzzer-tried-to-kill-me']]],
 ['pac-man','aug 2020 · javascript, canvas','Leapfrog internship project','My internship project at Leapfrog, written to learn JavaScript and the canvas API. Easy, medium and hard modes, three power-ups (Red Cherry, Ghost Wrap, Blue Dot), and a two-player mode on WASD with a freeze and unfreeze mechanic. The ghosts use path-finding rather than random movement.',[['GitHub','https://github.com/maskeynihal/pacman'],['play standalone','https://maskeynihal.github.io/pacman/']]]];
const OSS=[['digitalocean/nginxconfig.io','independent scrolling in split-column mode','2023-06'],['digitalocean/nginxconfig.io','prettier via lint-staged','2023-10'],['spatie/holidays','Nepal holiday calendar, with tests','2024-10'],['kritish-dhaubanjar/dynamodb-dashboard','18 commits: validation, download, search fixes, demo videos','2023 → 2026'],['kritish-dhaubanjar/dev-auth-chrome-extension','Svelte rewrite, add-user form, token handling','2021 → 2022'],['benawad/dogehouse','Nepali translation, persist language','2021'],['supabase/supabase','null-check fix; docs','2021 → 2023']];
const POSTS=[['2026-10-26','I built a water + air monitor on an Arduino, and the buzzer tried to kill me','UNO R4 WiFi, DS18B20, DHT22, SH1106 OLED and a buzzer. The buzzer jammed because tone() and digitalWrite() shared a pin.'],['2024-05-11','SSH into Docker with Root User','SSH as root into a container.'],['2024-04-30','Running laravel on a server','Nginx, PHP 8.0-FPM, Composer and MySQL on Ubuntu.'],['2023-01-24','Accessing GitHub in the server using the deploy key','Per-repo deploy keys.'],['2022-01-22','Laravel: Testing, Factory, and Events','withoutEvents to fix a NOT NULL user_id set by a creating hook in tests.']];
const CV=[['2025 →','Lead Engineer','Leapfrog Technology',['Lead the engineering team for a US behavioural-health platform.','Own the AWS architecture for sensitive health data under HIPAA and SOC 2.','Mentor engineers and set code review and security practice.','Work with product and design on what ships next.']],['2023 → 2025','Senior Software Engineer','Leapfrog Technology',['Coordinated work across teams in the US, Australia and Nepal.','Cut the frontend bundle by 20% with tree-shaking and memoisation.','Made key backend APIs more than twice as fast.','Automated backups, metrics and notifications with SQS, EventBridge, Lambda and Step Functions.','Shaped the technical roadmap and wrote user stories.']],['2021 → 2023','Software Engineer','Leapfrog Technology',['Led a team of more than 15 across development, design, DevOps and QA.','Planned releases with product owners and shipped major versions.','Main contact for stakeholders and management.']],['2020 → 2021','Associate Software Engineer','Leapfrog Technology',['Built features with senior engineers and product owners.','Tracked down root causes in production bugs.','Built a browser extension the team used daily.']],['2020','Software Engineer Intern','Leapfrog Technology',['Learned JavaScript and the canvas API by rebuilding Pac-Man with path-finding ghosts.','First steps in Node.js and React.']],['2019 → 2020','Web Application Developer','Technorio, Kathmandu',['Shipped web apps for insurance management, video streaming and ticketing.','Set up GitHub Actions deploys.','Worked with business development on estimates.']]];
const CVCARDS=[['co-founder','Daboo Spaces, Kathmandu','A coworking space in Sankhamul Tower 1.'],['education','BE computer engineering','Kantipur Engineering College, Tribhuvan University, 2021.'],['skills','What I work with','TypeScript, JavaScript, React, Node.js, Laravel, PHP, AWS (Lambda, SQS, EventBridge, Step Functions), PostgreSQL, MySQL, HIPAA and SOC 2 work, team leadership.']];
const SOC=[['github','https://github.com/maskeynihal'],['linkedin','https://www.linkedin.com/in/maskeynihal'],['x','https://x.com/nihalmaskey'],['instagram','https://www.instagram.com/maskeynihal'],['hashnode','https://nihalmaskey.hashnode.dev']];

const SECS=[
 ['about','l',()=>ABOUT.map(p=>`<p>${esc(p)}</p>`).join('')+`<p>Outside work I co-founded <a href="https://daboospaces.com">Daboo Spaces</a>, a coworking space in Sankhamul, Kathmandu, with desks, private offices and a community of founders, freelancers and remote workers.</p><div class="panel"><p class="eyebrow">at a glance</p><dl>${FACTS.map(f=>`<dt>${f[0]}</dt><dd>${esc(f[1])}</dd>`).join('')}</dl></div>`],
 ['projects','r',()=>`<p>Side projects, each built to fix something that annoyed me.</p>`+WORK.map(w=>`<div class="panel"><p class="eyebrow">${esc(w[1])}</p><h3>${esc(w[0])}</h3><p class="meta">${esc(w[2])}</p><p>${esc(w[3])}</p>${w[4].length?`<div class="links">${w[4].map(l=>`<a href="${l[1]}">${esc(l[0])}</a>`).join('')}</div>`:''}</div>`).join('')],
 ['open source','l',()=>`<ul class="rows">${OSS.map(o=>`<li><b>${esc(o[0])}</b>${esc(o[1])}<br><span class="m">merged ${esc(o[2])}</span></li>`).join('')}</ul>`],
 ['writing','r',()=>`<p>Posts on Hashnode since 2022. Four are server and Laravel notes; the latest is the Arduino monitor.</p><ul class="rows">${POSTS.map(o=>`<li><span class="m">${o[0]}</span><b>${esc(o[1])}</b>${esc(o[2])}</li>`).join('')}</ul><p><a href="https://nihalmaskey.hashnode.dev">all posts on hashnode</a></p>`],
 ['cv','l',()=>`<ul class="rows">${CV.map(r=>`<li><span class="m">${esc(r[0])}</span><b>${esc(r[1])}, ${esc(r[2])}</b><ul>${r[3].map(d=>`<li style="border:0;padding:1px 0">${esc(d)}</li>`).join('')}</ul></li>`).join('')}</ul>`+CVCARDS.map(c=>`<div class="panel"><p class="eyebrow">${c[0]}</p><h3>${esc(c[1])}</h3><p>${esc(c[2])}</p></div>`).join('')],
 ['contact','r',()=>`<p>Email is fastest. I read everything and reply to most within a couple of days.</p><p><a href="mailto:contact@nihal.com.np">contact@nihal.com.np</a></p><p>Kathmandu is UTC+5:45 with no daylight saving.</p><p>${SOC.map(s=>`<a href="${s[1]}">${s[0]}</a>`).join(' · ')}</p><form onsubmit="return false"><label class="field"><span>your name</span><input autocomplete="off"></label><label class="field"><span>your email</span><input autocomplete="off"></label><label class="field"><span>what's this about</span><input autocomplete="off"></label><label class="field"><span>message</span><textarea rows="4"></textarea></label><button class="btn" type="button">send</button></form>`]
];
const sheet=document.getElementById('sheet'), idx=document.querySelector('.index');
sheet.insertAdjacentHTML('beforeend',`<header class="titleblock"><h1>${TB.name}</h1><p class="kick">${TB.kicker}</p><p>${esc(TB.line)}</p></header>`);
SECS.forEach(([h,side,body],i)=>{
  const txt=side, art=side==='r'?'l':'r';
  sheet.insertAdjacentHTML('beforeend',`<section class="section" id="${h.replace(' ','-')}"><div class="grid"><div class="txt ${txt}"><p class="eyebrow">sheet ${i+2}</p><h2>${h}</h2>${body()}</div><div class="empty-col ${art}" data-empty="${art}"></div></div></section>`);
});
sheet.insertAdjacentHTML('beforeend',`<div class="foot">© 2026 Nihal Maskey. Source on GitHub. · prototype: side art v2</div>`);
NAV.forEach((n,i)=>idx.insertAdjacentHTML('beforeend',`<div><b>${String(i+1).padStart(2,'0')}</b>${n}</div>`));

/* ================= engine ================= */
const TAU=Math.PI*2, PI=Math.PI;
const cv=document.getElementById('art'), g=cv.getContext('2d');
const root=document.documentElement;
const qs=new URLSearchParams(location.search);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches||qs.get('rm')==='1';
const PAL={
  4:{rgb:'31,63,224',pg:'246,245,241',day:1},
  3:{rgb:'26,58,203',pg:'217,218,227',day:.78},
  2:{rgb:'20,47,184',pg:'179,180,198',day:.5},
  1:{rgb:'255,255,255',pg:'31,63,224',day:.2},
  0:{rgb:'232,236,255',pg:'10,19,72',day:0}
};
const E={tt:0,sy:0,H:innerHeight,W:innerWidth,lamp:1,day:.2,dayT:.2,rgb:PAL[1].rgb,pg:PAL[1].pg,reduced,sv:0,ref:0,cx:-9999,cy:-9999,present:false,ms:0,dpr:1,dark:true};
let cols=[], vi=1, pageH=0;
const VAR=[null];   // VAR[n] = {name,short,init,update,draw,tap}
const stats={}; for(let i=1;i<=8;i++) stats[i]={n:0,sum:0,max:0};

/* ---- seeded helpers ---- */
const rnd=(a,b=0)=>{const s=Math.sin(a*127.1+b*311.7+78.233)*43758.5453;return s-Math.floor(s)};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const mulberry=s=>()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
/* ---- drawing helpers (hand-drawn, wobble is seeded so it never flickers) ---- */
const SA=(a)=>`rgba(${E.rgb},${a})`, PG=(a=1)=>`rgba(${E.pg},${a})`;
function ink(a=.85,w=1.5){g.strokeStyle=SA(a);g.lineWidth=w;g.stroke()}
function fillS(a){g.fillStyle=SA(a);g.fill()}
function fillP(a=1){g.fillStyle=PG(a);g.fill()}
/* wobbly polyline through pts [[x,y],...]; adds to current path (starts with moveTo unless cont) */
function PL(pts,seed=1,amp=.8,close=false,cont=false,step=14){
  const n=pts.length; let k=0, first=true;
  const end=close?n:n-1;
  for(let i=0;i<end;i++){
    const a=pts[i], b=pts[(i+1)%n]; const dx=b[0]-a[0], dy=b[1]-a[1]; const L=Math.hypot(dx,dy)||1;
    const m=Math.max(1,Math.round(L/step)), nx=-dy/L, ny=dx/L;

    lm.push({kind:kinds[ki++%kinds.length],x:best.x,y:best.y,sz:(0.95+rg()*.3)*u*(c.phone?.9:1.1)});
  }
  const dog={s:Math.min(L,((E.sy-c.t+E.H*.5)/Math.max(h,1))*L*0),x:px[0],y:py[0],face:1,mode:'path',ph:0,gait:0,t:0,head:0,tail:.6,idle:0,ball:false,pant:false};
  const i0=Math.max(0,Math.min(px.length-1,Math.round((clamp(E.sy-c.t+E.H*.5,40,h-50)-34)/6)));dog.s=ls[i0];dog.x=px[i0];dog.y=py[i0];
  return {px,py,ls,L,lm,dog,prints:[],ball:null,u,pm:null,pstill:0,near:0,t:0,pmv:0,away:0};
},
pathAt(s,d){const ls=s.ls;let lo=0,hi=ls.length-1;d=clamp(d,0,s.L);while(hi-lo>1){const m=(lo+hi)>>1;if(ls[m]<d)lo=m;else hi=m}const t=(d-ls[lo])/((ls[hi]-ls[lo])||1);return [lerp(s.px[lo],s.px[hi],t),lerp(s.py[lo],s.py[hi],t)]},
tap(c,s,x,y){
  s.ball={x:x,y:y-80,x1:x,y1:y,t:0,state:'fall',vy:0,rest:0,carried:false};
  s.dog.mode='fetch';
},
update(c,s,dt){
  const d=s.dog,u=s.u;s.t+=dt;d.t+=dt;
  const t=s.t;
  // pointer
  let pv=0;if(c.mIn&&s.pm)pv=Math.hypot(c.mx-s.pm[0],c.my-s.pm[1])/Math.max(dt,1e-3);
  s.pm=c.mIn?[c.mx,c.my]:null;
  s.pmv=lerp(s.pmv,pv,.2);
  if(c.mIn)s.away=0;else s.away+=dt;
  const dist=(x,y)=>Math.hypot(x-d.x,y-d.y);
  const go=(tx,ty,sp,stopAt=0)=>{const dx=tx-d.x,dy=ty-d.y,L=Math.hypot(dx,dy);if(L<=stopAt+.5){d.sp=0;return 0}const mv=Math.min(L-stopAt,sp*dt);d.x+=dx/L*mv;d.y+=dy/L*mv;d.sp=mv/dt;if(Math.abs(dx)>3)d.face=dx>0?1:-1;return L-mv};
  d.sp=0;
  // the ball
  const b=s.ball;
  if(b){
    if(b.state==='fall'){b.vy+=1500*dt;b.y+=b.vy*dt;if(b.y>=b.y1){b.y=b.y1;b.vy=-b.vy*.45;b.bn=(b.bn||0)+1;if(b.bn>2||Math.abs(b.vy)<90){b.state='rest';b.vy=0}}}
    else if(b.state==='carried'){b.x=d.x+d.face*36*u;b.y=d.y-48*u}
    else if(b.state==='dropped'){b.rest+=dt;if(b.rest>5)s.ball=null}
  }
  // mode transitions
  const ytar=clamp(E.sy-c.t+E.H*.5,40,c.h-50);
  if(d.mode!=='fetch'&&d.mode!=='bring'){
    if(c.mIn&&s.pmv>80&&d.mode!=='chase'&&d.mode!=='pet'&&dist(c.mx,c.my)>90){d.mode='chase'}
    if((d.mode==='chase'||d.mode==='pet')&&s.away>1.6){d.mode='return'}
  }
  // find the home point of the path: where the viewport is
  const sT=(()=>{const i=Math.max(0,Math.min(s.px.length-1,Math.round((ytar-34)/6)));return s.ls[i]})();
  if(d.mode==='path'){
    const diff=sT-d.s;
    if(Math.abs(diff)>8){const sp=Math.min(320,50+Math.abs(diff)*2.2);const step=Math.sign(diff)*Math.min(Math.abs(diff),sp*dt);d.s+=step;d.sp=Math.abs(step)/dt;d.idle=0;const q=VAR[8].pathAt(s,d.s);if(Math.abs(q[0]-d.x)>1)d.face=q[0]>d.x?1:-1;d.x=q[0];d.y=q[1]}
    else{d.idle+=dt;const q=VAR[8].pathAt(s,d.s);d.x=q[0];d.y=q[1]}
    d.pose=d.idle<.01?'walk':(d.idle<2.6?'sniff':'sit');
  }else if(d.mode==='chase'){
    const L=go(c.mx,c.my+18,330,52);d.pose='walk';
    if(L<3&&s.pmv<120){d.mode='pet'}
    if(!c.mIn&&s.away>1.6)d.mode='return';
  }else if(d.mode==='pet'){
    d.pose='sit';if(c.mIn){d.face=c.mx>d.x?1:-1}
    if(c.mIn&&dist(c.mx,c.my+18)>130)d.mode='chase';
    if(!c.mIn&&s.away>1.6)d.mode='return';
  }else if(d.mode==='return'){
    // nearest path point
    let bi=0,bd=1e9;for(let i=0;i<s.px.length;i+=2){const dd=Math.hypot(s.px[i]-d.x,s.py[i]-d.y);if(dd<bd){bd=dd;bi=i}}
    const L=go(s.px[bi],s.py[bi],250,0);d.pose='walk';
    if(L<4){d.s=s.ls[bi];d.mode='path';d.idle=0}
  }else if(d.mode==='fetch'){
    if(!b){d.mode='path'}
    else if(b.state==='fall'){d.pose='walk';d.sp=0;if(Math.abs(b.x1-d.x)>3)d.face=b.x1>d.x?1:-1;}
    else if(b.state==='rest'){const L=go(b.x-d.face*0,b.y+8,340,6);d.pose='walk';if(L<3){b.state='carried';b.carried=true;d.mode='bring';d.home=c.mIn?[c.mx,c.my+18]:VAR[8].pathAt(s,d.s)}}
  }else if(d.mode==='bring'){
    const hx=d.home[0],hy=d.home[1];const tgt=c.mIn?[c.mx,c.my+18]:d.home;
    const L=go(tgt[0],tgt[1],300,56);d.pose='walk';
    if(L<4){if(b){b.state='dropped';b.rest=0;b.carried=false;b.x=d.x+d.face*40*u;b.y=d.y}d.mode='pet';d.petT=0}
  }
  // gait
  const moving=d.sp>20;
  if(moving)d.ph+=dt*(d.sp/22+4);
  d.gait=lerp(d.gait,moving?clamp(d.sp/260,.45,1):0,Math.min(1,dt*10));
  d.pant=d.sp>200||d.pose==='sit';
  // paw prints
  if(moving){s.lastPaw=s.lastPaw||{x:d.x,y:d.y};if(Math.hypot(d.x-s.lastPaw.x,d.y-s.lastPaw.y)>26*u){s.prints.push({x:d.x,y:d.y+1,a:Math.atan2(d.y-s.lastPaw.y,d.x-s.lastPaw.x),t:t,side:s.prints.length%2?1:-1});s.lastPaw={x:d.x,y:d.y};if(s.prints.length>26)s.prints.shift()}}
  const sniffAmt=d.pose==='sniff'?1:0;d.head=lerp(d.head,sniffAmt*.85+(moving?.05*Math.sin(d.ph*2):0)-(d.pose==='sit'?.18:0),Math.min(1,dt*6));
  d.tail=lerp(d.tail,d.pose==='sit'||d.mode==='pet'?1:(moving?.5:.7),Math.min(1,dt*4));
},
draw(c,s){
  const d=s.dog,u=s.u,t=s.t,D=E.day,h=c.h,w=c.w;
  // the trail: a dashed line, plus the walked part in solid
  const px=s.px,py=s.py;
  g.beginPath();g.setLineDash([9,9]);g.moveTo(px[0],py[0]);for(let i=1;i<px.length;i++)g.lineTo(px[i],py[i]);ink(.6,1.8);g.setLineDash([]);
  // landmarks
  const gl=sm(.5,0,D);
  for(const l of s.lm){if(l.y<c.v0-90||l.y>c.v1+40)continue;
    const k=l.kind;
    if(k==='tree')DG.tree(l.x,l.y,l.sz,t);else if(k==='sign')DG.sign(l.x,l.y,l.sz,l.y%3<1?'garden':l.y%3<2?'daboo':'ktm');else if(k==='pond')DG.pond(l.x,l.y,l.sz,t);else if(k==='lamp')DG.lamp(l.x,l.y,l.sz,gl);
    else if(k==='rock')DG.rock(l.x,l.y,l.sz);else if(k==='fence')DG.fence(l.x-30*l.sz,l.y,l.sz);else if(k==='flowers')DG.flowers(l.x,l.y,l.sz,t);else if(k==='chai')DG.chai(l.x,l.y,l.sz,t);
    else if(k==='wheel')DG.wheel(l.x,l.y,l.sz);else if(k==='bench')DG.bench(l.x,l.y,l.sz);else if(k==='mailbox')DG.mailbox(l.x,l.y,l.sz);else DG.hydrant(l.x,l.y,l.sz);
    g.beginPath();g.moveTo(l.x-30*l.sz,l.y+1);g.lineTo(l.x+30*l.sz,l.y+1);ink(.35,1.2);
  }
  // paw prints
  for(const p of s.prints){const age=t-p.t;if(age>7)continue;DG.paw(p.x+Math.sin(p.a)*5*p.side*-1,p.y+Math.cos(p.a)*5*p.side*0,p.a,.6*(1-age/7))}
  // ball
  const b=s.ball;if(b&&b.state!=='carried'){const a=b.state==='dropped'?Math.min(1,(5-b.rest)*1.2):1;g.globalAlpha=a;DG.ball(b.x,b.y,6*u);if(b.state==='fall'){g.beginPath();g.ellipse(b.x1,b.y1+7,7,2,0,0,TAU);ink(.5,1.2)}g.globalAlpha=1}
  // the dog
  if(d.y>c.v0-120&&d.y<c.v1+60){
    const sc=u*(c.phone?1.15:1.45);
    g.save();g.translate(d.x,d.y);g.scale(d.face*sc,sc);
    if(d.pose==='sit')DG.sit(d.head,d.tail,d.pant,t,b&&b.carried);
    else DG.stand(d.ph,d.gait,d.head,d.tail,d.pant&&d.gait>.5,t,b&&b.carried);
    g.restore();
    g.beginPath();g.ellipse(d.x,d.y+1,24*sc*.6,3,0,0,TAU);ink(.25,1.1);
  }
  if(b&&b.state==='carried'){DG.ball(b.x,b.y,6*u)}
}};

/* ================= picker ================= */
const $=id=>document.getElementById(id), pick=$('pick'), g8=$('g8'), lampsEl=$('lamps');
for(let i=1;i<=8;i++){ if(!VAR[i]) continue; const b=document.createElement('button'); b.dataset.v=i; b.innerHTML=`<b>${i}</b><small>${VAR[i].short}</small>`; b.setAttribute('aria-label',`Variation ${i}, ${VAR[i].name}`); g8.appendChild(b)}
for(const l of [4,3,2,1,0]){const b=document.createElement('button');b.dataset.l=l;b.textContent=l;b.setAttribute('aria-label','Lamp level '+l);lampsEl.appendChild(b)}
const CAPT={1:'tap: drop',2:'tap: spin',3:'tap: gust',4:'tap: bloom',5:'move: nudge',6:'tap: pulse',7:'tap: wish',8:'tap: ball'};
const CAPL={1:'Tap or click the art to drop a marble; scrolling tips the track.',2:'Tap or click near the mobile to spin and swing it; scroll sets it swaying.',3:'Tap or click for a gust; the kite leans to the pointer.',4:'Tap or click to grow a flower; the butterfly lands near the pointer.',5:'Move the pointer near the pen to nudge it; scroll to plot.',6:'Tap or click a component to fire a pulse down the board.',7:'Tap or click to make a wish; switch the lamp to change the sky.',8:'Tap or click to throw the ball; move the pointer and the dog follows.'};
function setVar(n){
  if(!VAR[n]) return; vi=n; $('curN').textContent=n; $('curT').textContent=VAR[n].short; $('curC').textContent=CAPT[n];$('hint').textContent=VAR[n].name+'. '+CAPL[n]+' Keys: 1-8 variation, L lamp.';
  g8.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===n));
  const u=new URL(location.href);u.searchParams.set('v',n);u.searchParams.set('l',E.lamp);try{history.replaceState(null,'',u)}catch(e){}
  kick();
}
function setLamp(l){
  E.lamp=l; root.dataset.lamp=l; E.rgb=PAL[l].rgb; E.pg=PAL[l].pg; E.dark=l<=1; $('curL').textContent=l;
  lampsEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.l===l));
  const u=new URL(location.href);u.searchParams.set('l',l);try{history.replaceState(null,'',u)}catch(e){}
  if(reduced) E.day=E.dayT=PAL[l].day; kick();
}
function setOpen(o){pick.classList.toggle('open',o);$('toggle').setAttribute('aria-expanded',o);$('toggle').setAttribute('aria-label',o?'Collapse the picker':'Open the picker')}
g8.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setVar(+b.dataset.v)});
lampsEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setLamp(+b.dataset.l)});
$('toggle').addEventListener('click',()=>setOpen(!pick.classList.contains('open')));
$('prev').addEventListener('click',()=>setVar(vi===1?8:vi-1));
$('next').addEventListener('click',()=>setVar(vi===8?1:vi+1));
$('lampcyc').addEventListener('click',()=>{const o=[4,3,2,1,0];setLamp(o[(o.indexOf(E.lamp)+1)%5])});
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/input|textarea/i.test(e.target.tagName)) return;
  if(/^[1-8]$/.test(e.key)) setVar(+e.key);
  if(e.key==='l'||e.key==='L') $('lampcyc').click();
});
setLamp(clamp(+(qs.get('l')??1),0,4)|0);E.day=E.dayT;
setVar(clamp(+(qs.get('v')||1),1,8)|0);
setOpen(qs.get('panel')==='1');

/* ================= test hooks ================= */
window.__art={
  stats,E,get cols(){return cols},setVar,setLamp,setOpen,
  tap(x,y){doTap(x,y)},
  pointer(x,y){E.cx=x;E.cy=y;E.present=true;kick()},
  advance(sec){const n=Math.round(sec*30);for(let i=0;i<n;i++){updateEnv(1/30);drawAll(1/30,true)}},
  bench(v,frames,flush){
    const prev=vi; vi=v; const arr=[]; const sy=scrollY;
    for(let i=0;i<frames;i++){const t0=performance.now();updateEnv(1/30);drawAll(1/30,true);if(flush)g.getImageData(0,0,1,1);arr.push(performance.now()-t0)}
    vi=prev;arr.sort((a,b)=>a-b);return {avg:arr.reduce((a,b)=>a+b,0)/arr.length,p95:arr[Math.floor(arr.length*.95)],max:arr[arr.length-1],vis:cols.filter(visible).length};
  }
};
layout();
})();
